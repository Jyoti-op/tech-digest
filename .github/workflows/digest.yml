name: Weekly TechPulse

on:
  schedule:
    # Saturday 10:00 Europe/Berlin. GitHub cron is UTC only, so fire at both possible
    # UTC hours (08:00 in summer, 09:00 in winter); the app's --scheduled check keeps the right one.
    - cron: "0 8,9 * * 6"
  workflow_dispatch:        # "Run workflow" button for sending one now
    inputs:
      force:
        description: "Ignore the weekly schedule"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models
      OLLAMA_MODEL: llama3.2:3b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Free AI: an open-source model runs inside this job via Ollama (no account, no API key).
      - name: Check schedule
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || python -c "
          import json,sys; sys.path.insert(0,'.')
          from digest.cli import is_scheduled_time
          sys.exit(0 if is_scheduled_time(json.load(open('config.json'))['schedule']) else 1)"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not Saturday 10:00 Berlin — skipping."
          fi

      - name: Cache AI model
        if: steps.when.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: .ollama-models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama
        if: steps.when.outputs.go == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      # The database remembers which stories each subscriber already got and caches AI write-ups.
      # It is kept in the Actions cache (never committed), restored from the latest run.
      - name: Restore digest database
        if: steps.when.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Build and send newsletter
        if: steps.when.outputs.go == 'true'
        env:
          AI_PROVIDER: ollama
          DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python main.py run --send
          ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
          ${{ inputs.force && '--force' || '' }}

      - name: Save digest database
        if: always() && steps.when.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}
