name: Daily Tech Digest

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 in Western Europe (winter), 08:00 in summer
  workflow_dispatch:        # "Run workflow" button for sending one now
    inputs:
      force:
        description: "Ignore daily/weekly schedule"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The database remembers which stories each subscriber already got.
      # It is kept in the Actions cache (never committed), restored from the latest run.
      - name: Restore digest database
        uses: actions/cache/restore@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Build and send digests
        env:
          DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py run --send ${{ inputs.force && '--force' || '' }}

      - name: Save digest database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}
